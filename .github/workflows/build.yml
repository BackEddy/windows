name: Build

# Testes + instalador. Em cada push: artefato "backeddy-windows". Em tags v*: release (pré-lançamento).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# publicar a release precisa de escrita no repositório (repositórios novos dão só leitura por padrão)
permissions:
  contents: write

env:
  KOPIA_VERSION: '0.19.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versão
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versão: $v"

      - name: Testes
        run: dotnet test tests/Backeddy.Core.Tests -c Release

      - name: Publicar o serviço
        run: dotnet publish src/Backeddy.Service -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o out/service

      # O backup em si é feito pelo Kopia (kopia.io, licença Apache 2.0), numa versão fixa, ao lado do serviço.
      - name: Baixar o Kopia ${{ env.KOPIA_VERSION }}
        shell: pwsh
        run: |
          $v = $env:KOPIA_VERSION
          $base = "https://github.com/kopia/kopia/releases/download/v$v"
          $zip = "kopia-$v-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path work | Out-Null
          Invoke-WebRequest "$base/$zip" -OutFile "work\$zip"
          $hash = (Get-FileHash "work\$zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256 de ${zip}: $hash"
          $sums = $null
          try { Invoke-WebRequest "$base/checksums.txt" -OutFile work\checksums.txt; $sums = "work\checksums.txt" }
          catch { Write-Warning "checksums.txt não encontrado; seguindo só com o SHA-256 acima" }
          if ($sums) {
            $line = Select-String -Path $sums -Pattern ([regex]::Escape($zip)) | Select-Object -First 1
            if ($line -and -not $line.Line.ToLower().StartsWith($hash)) { throw "SHA-256 não confere com checksums.txt" }
            if ($line) { Write-Host "Conferido com checksums.txt" }
          }
          Expand-Archive "work\$zip" -DestinationPath work\kopia -Force
          $exe = Get-ChildItem work\kopia -Recurse -Filter kopia.exe | Select-Object -First 1
          if (-not $exe) { throw "kopia.exe não está no zip" }
          Copy-Item $exe.FullName out\service\kopia.exe
          $lic = Get-ChildItem work\kopia -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName out\service\kopia-LICENSE.txt }
          & out\service\kopia.exe --version

      - name: Publicar o app
        run: dotnet publish src/Backeddy.App -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:Version=${{ env.VERSION }} -o out/app

      - name: Montar o instalador
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:VERSION" installer\Backeddy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out\*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: backeddy-windows
          path: out/Backeddy-Setup-*.exe

      - name: Publicar na release (tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Backeddy-Setup-*.exe
          body_path: .github/release-notes.md
          prerelease: true
